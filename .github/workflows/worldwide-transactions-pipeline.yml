name: Worldwide transactions pipeline

on:
  push:
    paths:
      - "projects/worldwide-transactions-pipeline/**"
      - ".github/workflows/worldwide-transactions-pipeline.yml"
  pull_request:
    paths:
      - "projects/worldwide-transactions-pipeline/**"
      - ".github/workflows/worldwide-transactions-pipeline.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/worldwide-transactions-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run a smoke pipeline
        run: python run_pipeline.py demo --count 100 --seed 42 --output-dir /tmp/world-transactions-output
