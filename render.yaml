services:
  - type: web
    name: interviewiq
    runtime: python
    plan: free
    rootDir: interviewiq
    buildCommand: npm ci && npm run build:frontend && pip install -r requirements.txt
    startCommand: python -m backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_TTS_VOICE
        value: hannah
